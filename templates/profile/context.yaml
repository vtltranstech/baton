# baton context settings (contracts/context-map.md section 8; schema schemas/context.json)
domain-field-patterns: [status, type, code, date, period, tier, flag, limit, amount, rate, class, family]
doc-sources: []   # files, folders or globs for baton context ingest, e.g. ["docs/legacy/**", "../confluence-export"]
profile-max-age-days: 30
blocking:
  light: [undefined-word, unresolved-edge-out]
  full: [undefined-word, unresolved-edge-out, undocumented-branch-in-changed-module, unprofiled-write]
interview-cap-minutes: 60
# OCR (scanned PDF pages, images, images inside Word and PowerPoint) runs only when the tesseract binary and
# these language files are installed from your organisation's mirror; nothing is ever downloaded.
ocr-languages: [eng]
# ocr-tessdata: /opt/org/tessdata
ocr-min-chars: 20
ocr-embedded-images: true
# /build-context-map: context explorers at once, and rounds of explore-grade-fix per area
explore-parallel: 4
explore-rounds: 3
# gate 0: open questions a changed area may still have for light-track work (never a contradiction)
light-open-questions: 2
# days a question may stay open before /standup marks it OVERDUE for the Tech Lead
question-ttl-days: 3
